# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings:
  # The other enabled general engines were repeatedly timing out or
  # rate-limiting this private local instance. Yahoo returned LinkedIn staff
  # profiles in a direct check, so use it as the current general search source.
  engines:
    keep_only:
      - yahoo

engines:
  - name: yahoo
    disabled: false

general:
  instance_name: "Job Referral Agent Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "job-referral-agent-local-secret-change-this"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

redis:
  url: false
